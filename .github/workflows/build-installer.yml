name: Installer bauen

# Baut den Windows-Installer (PyInstaller + Inno Setup) auf einem GitHub-Windows-Runner –
# inhaltlich dasselbe wie build_installer.bat lokal (Aufbau wie im SHS-Prüfungsprogramm).
#
# Ausgelöst durch:
#   - einen gepushten Versions-Tag "vX.Y.Z"  → baut, testet UND veröffentlicht ein Release
#   - manuell über "Run workflow"            → baut und testet nur (Artefakt zum Herunterladen)
#
# Die Versionsnummer erhöht dieser Workflow NICHT selbst; er baut mit der in version.txt
# eingecheckten Nummer. Ablauf für ein Release (siehe README_INSTALLER.md):
#   1. lokal `python bump_version.py`, RELEASE_NOTES.md schreiben
#   2. version.txt, version_info.txt, bilderkatalog/version.py, RELEASE_NOTES.md committen, pushen
#   3. `git tag vX.Y.Z && git push origin vX.Y.Z`
#
# Fremde Actions sind auf einen festen Commit-Hash festgelegt (Version als Kommentar),
# damit ein nachträglich verschobener Tag keinen anderen Code in den Build bringt.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Der Build-Job (installiert Fremdpakete) hat nur Leserechte; das Schreibrecht zum
# Anlegen des Release hat allein der getrennte release-Job.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller==6.22.3

      - name: Tests
        run: python -m pytest -q

      - name: Versionsnummer aus version.txt auslesen
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Prüfen, dass Tag, version.txt und version.py zusammenpassen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        # Tag-Name nur über eine Umgebungsvariable, nie direkt ins Skript eingesetzt.
        env:
          TAG_NAME: ${{ github.ref_name }}
          DATEI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:TAG_NAME -notmatch '^v\d+\.\d+\.\d+$') { Write-Error "Tag hat nicht das Format vX.Y.Z"; exit 1 }
          if ($env:TAG_NAME.Substring(1) -ne $env:DATEI_VERSION) {
            Write-Error "Tag '$($env:TAG_NAME)' passt nicht zu version.txt ('$($env:DATEI_VERSION)'). Zuerst 'python bump_version.py' laufen lassen, die Versionsdateien committen und pushen, DANN taggen."
            exit 1
          }
          $py = python -c "import bilderkatalog; print(bilderkatalog.__version__)"
          if ($py -ne $env:DATEI_VERSION) { Write-Error "bilderkatalog/version.py ($py) passt nicht zu version.txt"; exit 1 }

      - name: Programm mit PyInstaller bauen
        run: pyinstaller --noconfirm --clean build.spec

      - name: Selbsttest der gebauten EXE
        # Fehlt in build.spec ein Modul oder eine Datendatei, scheitert der Build HIER
        # statt erst beim Nutzer.
        shell: pwsh
        run: |
          $protokoll = Join-Path $env:RUNNER_TEMP "selbsttest_exe.log"
          $p = Start-Process -FilePath "dist\Bilderkatalog\Bilderkatalog.exe" -ArgumentList "--selbsttest", "`"$protokoll`"" -Wait -PassThru
          if (Test-Path $protokoll) { Get-Content $protokoll } else { Write-Host "Kein Protokoll geschrieben" }
          if ($p.ExitCode -ne 0) { Write-Error "Selbsttest fehlgeschlagen (Exit-Code $($p.ExitCode))"; exit 1 }

      - name: Inno Setup installieren
        run: choco install innosetup --version=6.7.1 -y

      - name: Installer mit Inno Setup bauen
        run: ISCC installer.iss /DMyAppVersion=${{ steps.version.outputs.version }}

      - name: Installer still installieren, installierte EXE testen, deinstallieren
        shell: pwsh
        run: |
          $setup = Get-ChildItem "Output\Bilderkatalog-Setup-*.exe" | Select-Object -First 1
          $ziel = Join-Path $env:RUNNER_TEMP "bilderkatalog-installiert"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$ziel`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Installation fehlgeschlagen (Exit-Code $($p.ExitCode))"; exit 1 }
          $exe = Join-Path $ziel "Bilderkatalog.exe"
          if (!(Test-Path $exe)) { Write-Error "Installierte EXE fehlt: $exe"; exit 1 }
          $protokoll = Join-Path $env:RUNNER_TEMP "selbsttest_installiert.log"
          $t = Start-Process -FilePath $exe -ArgumentList "--selbsttest", "`"$protokoll`"" -Wait -PassThru
          if (Test-Path $protokoll) { Get-Content $protokoll } else { Write-Host "Kein Protokoll geschrieben" }
          $u = Start-Process -FilePath (Join-Path $ziel "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($t.ExitCode -ne 0) { Write-Error "Selbsttest der installierten EXE fehlgeschlagen"; exit 1 }
          if ($u.ExitCode -ne 0) { Write-Error "Deinstallation fehlgeschlagen"; exit 1 }

      - name: Setup als Artefakt hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Bilderkatalog-Setup-${{ steps.version.outputs.version }}
          path: Output\Bilderkatalog-Setup-*.exe

  release:
    # Eigener Job mit Schreibrecht, nur bei einem Versions-Tag – führt keinen Build-Code
    # aus, sondern veröffentlicht nur das geprüfte Artefakt.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code auschecken (für RELEASE_NOTES.md)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup aus dem build-Job holen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Bilderkatalog-Setup-${{ needs.build.outputs.version }}
          path: Output

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: Output/Bilderkatalog-Setup-*.exe
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
