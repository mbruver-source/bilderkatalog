name: Tests

# Führt die Tests bei jedem Push und Pull Request aus (Windows, weil der lokale Modus
# Windows-Funktionen für OneDrive-Platzhalter nutzt).

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Code auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Selbsttest aus dem Quellcode
        shell: pwsh
        run: |
          $protokoll = Join-Path $env:RUNNER_TEMP "selbsttest.log"
          python app.py --selbsttest $protokoll
          $code = $LASTEXITCODE
          Get-Content $protokoll
          exit $code
