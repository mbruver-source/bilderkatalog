[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bilderkatalog"
dynamic = ["version"]
description = "Bilderkatalog für OneDrive ohne Azure-Registrierung: sortieren, gruppieren, virtuelle Alben und ZIP-Export über Metadaten."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "msal>=1.28",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "python-dotenv>=1.0",
    "reverse_geocoder>=1.5",
    "pillow>=10",
    "pywin32>=306; sys_platform == 'win32'",
    "pywebview>=5; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
heic = ["pillow-heif>=0.16"]
fenster = ["pywebview>=5"]  # macOS/Linux: eigenes Programmfenster (benötigt Qt oder GTK)

[project.scripts]
bilderkatalog = "bilderkatalog.__main__:main"

[project.gui-scripts]
bilderkatalog-app = "bilderkatalog.__main__:main_gui"

[tool.setuptools]
packages = ["bilderkatalog"]

[tool.setuptools.dynamic]
version = { attr = "bilderkatalog.version.VERSION" }  # aus version.txt via bump_version.py

[tool.setuptools.package-data]
bilderkatalog = ["static/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
